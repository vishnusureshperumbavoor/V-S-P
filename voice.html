  <!-- Open Graph / Social Cards -->
  <meta property="og:type" content="website" />

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@vspeeeeee" />
  <meta name="twitter:title" content="VSP Voice Bot | Conversational Voice Assistant" />
  <meta name="twitter:description" content="Talk hands-free with VSP Voice Bot, an intelligent in-browser voice assistant by Vishnu Suresh Perumbavoor." />

  <!-- Google fonts -->
  <link href="//fonts.googleapis.com/css?family=Nunito:400,600,700,800,900&display=swap" rel="stylesheet" />

    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Base Theme & Voice Agent CSS -->
  <link rel="stylesheet" href="assets/css/style-starter.css" />
  <link rel="stylesheet" href="assets/css/voice-agent.css?v=2.0" />
</head>

<body class="vsp-voice-page">
  <!-- Ambient Cosmic Glows -->
  <div class="voice-ambient-bg" aria-hidden="true">
    <div class="voice-glow-1"></div>
    <div class="voice-glow-2"></div>
  </div>

  <!-- Shared Global Navigation Topbar Header -->
  <header id="vsp-header"></header>

  <!-- Main Voice App Container (Fixed viewport, zero content expansion) -->
  <main class="voice-app-wrap">

    <!-- Top HUD Branding & Model Status Indicator -->
    <div class="voice-hud-header">
      <h1 class="voice-title">VSP Voice Bot</h1>
      <div class="voice-status-pill state-ready" id="voice-status-pill" aria-live="polite">
        <span class="voice-status-dot"></span>
        <span id="voice-status-text">AI Model Ready</span>
      </div>
    </div>

    <!-- Central Interactive Holographic Voice Orb Area -->
    <div class="voice-stage-container state-idle" id="voice-stage">
      <div class="voice-orb-wrapper">
        <canvas id="voice-canvas" class="voice-canvas"></canvas>
        <div class="voice-ring voice-ring-1" aria-hidden="true"></div>
        <div class="voice-ring voice-ring-2" aria-hidden="true"></div>
        <div class="voice-ring voice-ring-3" aria-hidden="true"></div>
        
        <button id="voice-orb" class="voice-orb" type="button" aria-label="Toggle voice session" title="Voice">
          <i class="fa-solid fa-microphone"></i>
        </button>
      </div>
    </div>

    <!-- Live Bottom Caption Dock (Fixed height, only live text, never expands page) -->
    <div class="voice-live-bottom-dock">
      <div class="voice-live-caption-card" id="voice-live-card" aria-live="polite">
        <span class="voice-live-badge badge-ready" id="voice-live-badge"><i class="fa-solid fa-microphone"></i></span>
        <p class="voice-live-text" id="voice-live-text">Tap the orb to start conversation</p>
      </div>
    </div>

  </main>

  <script src="assets/js/nav-footer.js"></script>
  <script src="assets/js/voice-agent.js?v=2.0"></script>
</body>

</html>
