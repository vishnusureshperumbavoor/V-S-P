<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta property="og:title" content="VSP 3D Lab | Three.js Visuals & Kinetic Typography" />
  <meta property="og:description" content="Interactive 3D laboratory and kinetic typography animations of VSP powered by Three.js and WebGL." />
  <title>VSP 3D Lab | Interactive Three.js Typography & Visuals</title>
  <link rel="icon" href="./assets/images/vsp3.jpeg" type="image/png" />

  <!-- Google fonts -->
  <link href="//fonts.googleapis.com/css?family=Nunito:400,700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Base Template CSS -->
  <link rel="stylesheet" href="assets/css/style-starter.css" />
  <!-- Dedicated 3D Lab CSS -->
  <link rel="stylesheet" href="assets/css/vsp-lab.css" />
</head>

<body class="vsp-lab-page">
  <!-- Shared Navigation Topbar Header -->
  <header id="vsp-header"></header>

  <!-- Top Corner Design Name HUD (Small text indicator requested) -->
  <aside class="vsp-design-hud" id="vsp-design-hud" aria-live="polite">
    <div class="vsp-hud-corner-bracket tl"></div>
    <div class="vsp-hud-corner-bracket br"></div>
    <div class="vsp-hud-status">
      <span class="vsp-hud-dot"></span>
      <span class="vsp-hud-category">WIREFRAME HUD</span>
    </div>
    <h1 class="vsp-hud-title" id="vsp-design-name">CYBERNETIC 3D VSP HOLOGRAPHIC MATRIX</h1>
  </aside>

  <!-- Top Right Telemetry HUD -->
  <aside class="vsp-telemetry-hud" aria-hidden="true">
    <div class="vsp-telemetry-row"><span>STATUS:</span> <strong>ONLINE // 3D</strong></div>
    <div class="vsp-telemetry-row"><span>FPS:</span> <strong id="vsp-hud-fps">60</strong></div>
    <div class="vsp-telemetry-row"><span>ELEMENTS:</span> <strong id="vsp-hud-polys">--</strong></div>
  </aside>

  <!-- Three.js Canvas Viewport -->
  <main id="vsp-three-viewport" aria-label="Interactive 3D Three.js Canvas"></main>

  <!-- Cyber Vignette Overlay -->
  <div class="vsp-cyber-vignette" aria-hidden="true"></div>

  <!-- Interactive Controls & Switcher Dock -->
  <nav class="vsp-lab-controls" aria-label="3D Design Controls">
    <!-- Sub-bar for 3D Avatar Models & Actions (Only visible in 3D Avatar mode) -->
    <div class="vsp-avatar-subbar" id="vsp-avatar-subbar" style="display: none;" role="region" aria-label="Avatar Roster and Actions">
      <div class="vsp-subbar-group" id="vsp-avatar-models">
        <button class="vsp-sub-btn active" data-avatar="michelle" type="button" title="Michelle (Dancer)">
          <i class="fa-solid fa-person-dress"></i> Michelle
        </button>
        <button class="vsp-sub-btn" data-avatar="robot" type="button" title="Robot Expressive">
          <i class="fa-solid fa-robot"></i> Robot
        </button>
        <button class="vsp-sub-btn" data-avatar="soldier" type="button" title="Vanguard Soldier">
          <i class="fa-solid fa-person-rifle"></i> Soldier
        </button>
        <button class="vsp-sub-btn" data-avatar="xbot" type="button" title="Xbot Cyborg">
          <i class="fa-solid fa-person-running"></i> Xbot
        </button>
        <button class="vsp-sub-btn" data-avatar="all" type="button" title="View All Side-by-Side">
          <i class="fa-solid fa-users"></i> All Squad
        </button>
      </div>

      <div class="vsp-subbar-divider" id="vsp-avatar-anim-divider" style="display: none;"></div>

      <!-- Animation Action Buttons (dynamically updated) -->
      <div class="vsp-subbar-group" id="vsp-avatar-anims"></div>
    </div>

    <!-- Background AI Cover Song Audio Track (No Crown Given) -->
    <audio id="vsp-dance-audio" preload="none" loop src="assets/songs/no_crown_given%20-%2005%20AI%20cover%20song.mp3"></audio>

    <div class="vsp-switcher-bar" role="tablist">
      <!-- Global AI Audio Beat Player across all 3D Labs (Front & Accessible on Mobile) -->
      <button class="vsp-mode-btn audio-toggle-btn" id="vsp-dance-music-btn" type="button" title="Toggle AI Cover Beat (No Crown Given)">
        <i class="fa-solid fa-music"></i> <span id="vsp-music-label">Beat: OFF</span>
      </button>

      <div class="vsp-subbar-divider" style="height: 18px; margin: 0 4px; flex-shrink: 0;"></div>

      <button class="vsp-mode-btn active" data-design="matrix" type="button" role="tab" aria-selected="true">
        <i class="fa-solid fa-cube"></i> Cyber Matrix
      </button>
      <button class="vsp-mode-btn" data-design="swarm" type="button" role="tab" aria-selected="false">
        <i class="fa-solid fa-atom"></i> Quantum Swarm
      </button>
      <button class="vsp-mode-btn" data-design="synaptic" type="button" role="tab" aria-selected="false">
        <i class="fa-solid fa-network-wired"></i> Synaptic Lattice
      </button>
      <button class="vsp-mode-btn" data-design="radar" type="button" role="tab" aria-selected="false">
        <i class="fa-solid fa-crosshairs"></i> Orbital Radar
      </button>
      <button class="vsp-mode-btn" data-design="water" type="button" role="tab" aria-selected="false">
        <i class="fa-solid fa-water"></i> Aquatic Fluid
      </button>
      <button class="vsp-mode-btn" data-design="hologram" type="button" role="tab" aria-selected="false">
        <i class="fa-solid fa-satellite-dish"></i> Hologram Beam
      </button>
      <button class="vsp-mode-btn" data-design="avatar" type="button" role="tab" aria-selected="false">
        <i class="fa-solid fa-person-walking"></i> 3D Avatar
      </button>
    </div>
  </nav>

  <!-- Navigation / Footer Component Engine -->
  <script src="assets/js/nav-footer.js"></script>

  <!-- Three.js & Controls -->
  <script src="assets/js/three.min.js"></script>
  <script src="assets/js/OrbitControls.js"></script>
  <script src="assets/js/DRACOLoader.js"></script>
  <script src="assets/js/GLTFLoader.js"></script>

  <!-- VSP 3D Laboratory Engine -->
  <script src="assets/js/vsp-three-lab.js"></script>
</body>
</html>
